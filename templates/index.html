<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chapter Watermarker</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 2.5rem auto; padding: 0 1rem; }
    h1 { margin-bottom: .25rem; }
    p.lead { color: #666; margin-top: 0; }
    form { display: grid; gap: 1.25rem; margin-top: 2rem; }
    label { display: block; font-weight: 600; margin-bottom: .35rem; }
    input[type=file], input[type=number] { width: 100%; padding: .5rem; box-sizing: border-box; }
    .row { display: flex; gap: 1rem; }
    .row > div { flex: 1; }
    .hint { font-weight: 400; color: #777; font-size: .85rem; }
    button { padding: .7rem 1.2rem; font-size: 1rem; font-weight: 600; cursor: pointer; border: 0; border-radius: 6px; background: #2563eb; color: #fff; }
    code { background: rgba(127,127,127,.15); padding: .1rem .3rem; border-radius: 4px; }
    nav { margin-bottom: 1.5rem; font-size: .95rem; }
    nav a { color: #2563eb; text-decoration: none; margin-right: 1rem; }
    nav a.active { font-weight: 700; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="active">Watermark chapters</a>
    <a href="/manual" download>Manual</a>
  </nav>
  <h1>Chapter Watermarker</h1>
  <p class="lead">Insert a figure beside each <code>Heading&nbsp;1</code> chapter title (tight text wrap) using the image whose file name contains the chapter's name.</p>

  <form action="/process" method="post" enctype="multipart/form-data">
    <div>
      <label for="docx">Documents (.docx)
        <span class="hint">&mdash; one, many, or a whole folder; each file is watermarked separately.</span>
      </label>
      <input id="docx" name="docx" type="file" accept=".docx" multiple>
      <details>
        <summary class="hint" style="cursor:pointer">&hellip;or choose a whole folder</summary>
        <input id="docxfolder" name="docx" type="file" webkitdirectory directory multiple>
      </details>
    </div>

    <div>
      <label for="watermarks">Figure images (.png, .jpg, .tif, .pdf)
        <span class="hint">&mdash; one or many; matched when the chapter name appears in the file name. Use PNG/PDF with a transparent or white background.</span>
      </label>
      <input id="watermarks" name="watermarks" type="file" accept=".png,.jpg,.jpeg,.tif,.tiff,.pdf" multiple required>
    </div>

    <div>
      <label for="width_pct">Figure width <span class="hint">% of page</span></label>
      <input id="width_pct" name="width_pct" type="number" min="5" max="90" value="30">
    </div>

    <fieldset style="border:1px solid rgba(127,127,127,.3);border-radius:8px;padding:.5rem 1rem 1rem;">
      <legend style="font-weight:700;padding:0 .4rem;">Diagonal watermark (optional)</legend>
      <label for="diagonal_text">Watermark text <span class="hint">(added diagonally to every page of the .docx; blank = none)</span></label>
      <input id="diagonal_text" name="diagonal_text" type="text" placeholder="e.g. CONFIDENTIAL">
      <label for="diagonal_opacity">Watermark opacity <span class="hint">% (25 = 75% transparent)</span></label>
      <input id="diagonal_opacity" name="diagonal_opacity" type="number" min="1" max="100" value="25">
    </fieldset>

    <button type="submit">Add watermarks</button>
  </form>

  <p><a href="/manual" download>&#8681; Download the manual (MANUAL.md)</a></p>
</body>
</html>
